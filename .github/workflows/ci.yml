name: Operations Queue Triage CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  test-and-smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile and type contract check
        run: python -m compileall -q app.py src tests scripts
      - name: Public API typecheck
        run: PYTHONPATH=src python scripts/typecheck.py
      - name: Lint
        run: ruff check app.py src tests scripts
      - name: Build package artifact
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: operations-queue-triage-wheel
          path: dist/*.whl
      - name: Unit tests
        run: pytest -q
      - name: Synthetic fixture smoke check
        run: python scripts/smoke_check.py
      - name: Streamlit health check
        run: python scripts/streamlit_health.py
