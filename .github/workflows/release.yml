name: Release artifact

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: operations-queue-triage-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Generate SHA-256 checksum
        run: (cd dist && sha256sum *.whl > operations-queue-triage.whl.sha256)
      - name: Attach wheel to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
